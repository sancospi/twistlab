<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cube</title>
  <style>
    :root { color-scheme: dark; --bg: #0b0d12; --fg: #e6e8ee; --muted: #8a90a0; --accent: #4ade80; --panel: #151924cc; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100dvh; background: radial-gradient(circle at 50% 40%, #1b2030, var(--bg)); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
    #cube { position: fixed; inset: 0; }
    #cube twisty-player { width: 100%; height: 100%; }
    .panel { position: fixed; top: 16px; left: 16px; right: 16px; max-width: 360px; padding: 16px; border-radius: 12px; background: var(--panel); backdrop-filter: blur(8px); display: grid; gap: 10px; }
    h1 { margin: 0; font-size: 18px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    button { font: inherit; padding: 8px 12px; border: 0; border-radius: 8px; background: #2a3142; color: var(--fg); cursor: pointer; }
    button.primary { background: var(--accent); color: #062b14; font-weight: 600; }
    button:disabled { opacity: .4; cursor: default; }
    dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; color: var(--muted); }
    dd { margin: 0; color: var(--fg); }
    #moves { font-family: ui-monospace, monospace; min-height: 1.4em; word-break: break-word; }
    #status.solved { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <div id="cube"></div>
  <div class="panel">
    <h1>Cube</h1>
    <div class="row">
      <button id="connect" class="primary">Conectar cubo GAN</button>
      <button id="demo">Demo sin cubo</button>
      <button id="reset-gyro" disabled>Recalibrar orientación</button>
      <button id="reset-state" disabled>Marcar como resuelto</button>
    </div>
    <dl>
      <dt>Estado</dt><dd id="status">Desconectado</dd>
      <dt>Cubo</dt><dd id="device">–</dd>
      <dt>Batería</dt><dd id="battery">–</dd>
    </dl>
    <div id="moves"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
