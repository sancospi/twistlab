  <script>
    // The layout depends on these (main.ts sets them too): set before the first paint so nothing moves when the app loads
    (function (b, p) {
      // Language (i18n.ts reads <html lang>): the URL's (/en/…, /pt/…; Spanish at the root). A visit that starts at a Spanish
      // URL goes to the chosen language's (else the browser's: en* → English) with replaceState, but not for crawlers:
      // they read each language at its own URL. A page the build wrote in Spanish waits hidden (html.i18n-wait) for
      // boot.ts to swap its texts, so they never flash (CSS shows it anyway after 3 s); one prerendered in its language
      // (<html lang> already it) doesn't. Its dictionary chunk (`dicts`, written in by the build: vite.config.ts) is
      // fetched alongside the app.
      var h = document.documentElement, dicts = {}, pre = /^\/(en|pt)(\/|$)/.exec(p), l = pre ? pre[1] : 'es', want, first;
      try { first = !sessionStorage.getItem('open'); } catch (x) {}
      if (!pre && first && !/bot|crawl|spider|slurp|google|lighthouse/i.test(navigator.userAgent || '')) {
        try { want = localStorage.getItem('lang'); } catch (x) {}
        if (want !== 'es' && want !== 'en' && want !== 'pt') want = /^en/i.test(navigator.language || '') ? 'en' : /^pt/i.test(navigator.language || '') ? 'pt' : 'es';
        if (want !== 'es') { l = want; history.replaceState(history.state, '', '/' + l + p + location.search + location.hash); p = location.pathname; }
      }
      if (l !== 'es' && h.lang !== l) h.classList.add('i18n-wait');
      h.lang = l;
      try { var tx = localStorage.getItem('ui-text'); if (tx === 'l' || tx === 'xl') h.dataset.text = tx; } catch (x) {} // Tamaño del texto, before the first paint
      if (dicts[l]) { var k = document.createElement('link'); k.rel = 'modulepreload'; k.crossOrigin = ''; k.href = dicts[l]; document.head.appendChild(k); }
      // Reopened (the installed app, or a new tab: nothing in this tab's session yet) at the start page: back where it
      // was left (router.ts saves it), if that was in this language. A link to a page, a reload or the Resolver's own
      // link still go where they say. `q`: the path without its language.
      var q = p.replace(/^\/(en|pt)(?=\/|$)/, '') || '/';
      try {
        if (q === '/' && !location.search && !location.hash && first) {
          var last = JSON.parse(localStorage.getItem('last-page')), lp = last && typeof last.path === 'string' && /^\/[^\/]/.test(last.path) && /^(?:\/(en|pt)(?=\/|$))?/.exec(last.path);
          // An unprefixed one saved before languages had URLs, by someone just sent to theirs (`want`): there in it
          if (lp && !lp[1] && want === l && l !== 'es') last.path = '/' + l + last.path, lp[1] = l;
          if (lp && (lp[1] || 'es') === l) { var st = last.state && typeof last.state === 'object' ? last.state : {}; st.scroll = +last.scroll || 0; history.replaceState(st, '', last.path); p = location.pathname; q = p.replace(/^\/(en|pt)(?=\/|$)/, '') || '/'; }
        }
        sessionStorage.setItem('open', '1');
      } catch (x) {}
      // The screen, as router.ts's parseRoute (index-html.test.ts checks every route against it)
      var m = /^\/(academia|algoritmos|hoy|como-resolver-el-cubo-de-rubik|cubos-inteligentes)(\/|$)/.test(q) ? 'academy' : /^\/progreso(\/|$)/.test(q) ? 'progress' : /^\/retos(\/|$)/.test(q) ? 'challenges' : /^\/acerca(\/|$)/.test(q) ? 'about' : /^\/(cubo|guia)(\/|$)/.test(q) ? 'cube' : q === '/' && /[?&]reto=/.test(location.search) ? 'challenges' : 'solve'; // a duel's link: router.ts takes it to /retos
      b.dataset.module = m;
      if (/^\/cubo\/pintar(\/|$)/.test(q)) b.setAttribute('data-paint', '');
      try { var e = JSON.parse(localStorage.getItem('cube-event')); if (m === 'solve' && typeof e === 'string' && e.slice(0, 3) !== '333' && e !== '222') b.classList.add('other-puzzle'); } catch (x) {} // the events without the 3D model, as timer.ts's has3d
      try { if (JSON.parse(localStorage.getItem('cube-3d')) === true) b.classList.add('cube-3d'); } catch (x) {} // Ver en 3D, as resolver.ts
      // First visit (none of the app's keys, as progress.ts's inBackup, but the empty times main.ts writes on load):
      // the Resolver's welcome card, laid out before the first paint so nothing moves. Dismissed: 'cube-welcome'.
      try { for (var i = 0, s = localStorage, k, fresh = true; fresh && i < s.length; i++) { k = s.key(i); if (/^(cube|academy|quiz|cross|practice|progress|paint)-/.test(k) && !(k === 'cube-results' && s.getItem(k) === '[]')) fresh = false; } if (fresh) b.classList.add('fresh'); } catch (x) {}
    })(document.body, location.pathname);
  </script>

        <p><a href="/como-resolver-el-cubo-de-rubik" data-i18n="paint.aboutLearn"></a> · <a href="/" data-i18n="solve.seoTitle"></a></p>
      </section>
    </section>
    <section id="mod-academy" data-i18n-aria-label="menu.academy"></section>
    <section id="mod-progress" class="cube-screen" data-i18n-aria-label="nav.progress"></section>
    <section id="mod-challenges" class="cube-screen" data-i18n-aria-label="challenges.title"></section>
    <!-- Acerca de (/acerca): static, shown by body[data-module="about"] (CSS), so a deep link has it on the first paint -->
    <section id="mod-about" class="cube-screen" aria-labelledby="about-title">
      <h2 id="about-title" data-i18n="about.title"></h2>
      <p data-i18n="about.intro"></p>
      <p class="lang-switch" role="group" aria-labelledby="about-lang"><span id="about-lang" data-i18n="lang.label"></span> <button type="button" data-lang="es" lang="es" aria-label="Español">ES</button> · <button type="button" data-lang="en" lang="en" aria-label="English">EN</button> · <button type="button" data-lang="pt" lang="pt" aria-label="Português">PT</button></p>
      <p class="lang-switch" role="group" aria-labelledby="about-text"><span id="about-text" data-i18n="text.label"></span> <button type="button" data-text="" data-i18n-aria-label="text.normal">A</button> · <button type="button" data-text="l" data-i18n-aria-label="text.large">A+</button> · <button type="button" data-text="xl" data-i18n-aria-label="text.xlarge">A++</button></p>
      <ul class="about-points">
        <li data-i18n="about.pointFree"></li>
        <li data-i18n="about.pointLocal"></li>
        <li data-i18n="about.pointCube"></li>
        <li data-i18n="about.pointOffline"></li>
      </ul>
      <h3 data-i18n="about.faq"></h3>
      <details><summary data-i18n="about.qFree"></summary><p data-i18n="about.aFree"></p></details>
      <details><summary data-i18n="about.qAccount"></summary><p data-i18n="about.aAccount"></p></details>
      <details><summary data-i18n="about.qCube"></summary><p data-i18n="about.aCube"></p></details>
      <details><summary data-i18n="about.qIphone"></summary><p data-i18n="about.aIphone"></p><p><a href="/cubo" data-i18n="about.aIphoneLink"></a></p></details>
      <details><summary data-i18n="about.qData"></summary><p data-i18n="about.aData"></p><p><a href="/progreso" data-i18n="about.aDataLink"></a></p></details>
      <details><summary data-i18n="about.qPrivacy"></summary><p data-i18n="about.aPrivacy"></p></details>
      <details><summary data-i18n="about.qOffline"></summary><p data-i18n="about.aOffline"></p></details>
      <details><summary data-i18n="about.qWho"></summary><p data-i18n="about.aWho"></p></details>
      <details><summary data-i18n="about.qWca"></summary><p data-i18n="about.aWca"></p></details>
      <details><summary data-i18n="about.qOpen"></summary><p data-i18n="about.aOpen"></p><p><a href="https://github.com/sancospi/twistlab" target="_blank" rel="noopener" data-i18n="about.aOpenLink"></a></p></details>
      <details><summary data-i18n="about.qSupport"></summary><p data-i18n="support.text"></p><p><a href="https://github.com/sponsors/sancospi" target="_blank" rel="noopener" data-i18n="support.github"></a></p></details>
    </section>
    <!-- a case's page (caseView.ts): the head goes in #mod-academy; the rest lives here, so its 3D cube is never re-attached -->
    <section id="case" class="case-page" hidden>
      <div class="case-visual"><div id="case-diagram" class="case-diagram"></div><div id="case-anim"></div><div id="case-player" class="case-player" role="group" data-i18n-aria-label="anim.label" hidden></div></div>
      <div id="case-body" class="case-body"></div>
    </section>
    <!-- the lesson player (lessonView.ts): outside #mod-academy, which is rebuilt per page, so its 3D cube is never re-attached -->
    <section id="lesson" class="lesson" aria-labelledby="lesson-title" hidden>
      <div class="lesson-card">
        <h2 id="lesson-title"></h2>
        <progress id="lesson-progress" data-i18n-aria-label="lesson.progress"></progress>
        <p id="lesson-count" class="hint"></p>
        <div id="lesson-text" class="lesson-text" tabindex="-1" aria-describedby="lesson-count"></div>
        <div id="lesson-player" class="lesson-player" hidden></div>
        <div id="lesson-body" class="lesson-body"></div>
        <p id="lesson-feedback" class="lesson-feedback" role="status"></p>
        <div class="row"><button id="lesson-prev" type="button" data-i18n="lesson.prev"></button><button id="lesson-next" type="button" class="primary" data-i18n="lesson.continue"></button></div>
      </div>
    </section>
    <section id="guide" hidden aria-live="polite">
      <div class="guide-head"><span><strong id="guide-title"></strong> · <span id="guide-progress"></span></span><button id="guide-stop" data-i18n="guide.stop"></button></div>
      <div id="guide-next"></div>
      <div id="guide-desc"></div>
      <div id="guide-steps"></div>
      <p class="hint" data-i18n="guide.holdHint"></p>
    </section>
    <div id="moves"></div>
  </main>
  <!-- the 3D cube (main.ts appends its player) with the view arrows in its corner; after the panel so the arrows tab after it -->
  <div id="cube">
    <div class="view" role="group" data-i18n-aria-label="view.label">
      <button data-turn="up" data-i18n-aria-label="view.up" data-i18n-title="view.upTitle">↑</button>
      <button data-turn="left" data-i18n-aria-label="view.left" data-i18n-title="view.leftTitle">←</button>
      <button data-turn="reset" data-i18n-aria-label="view.reset" data-i18n-title="view.resetTitle">⟲</button>
      <button data-turn="right" data-i18n-aria-label="view.right" data-i18n-title="view.rightTitle">→</button>
      <button data-turn="down" data-i18n-aria-label="view.down" data-i18n-title="view.downTitle">↓</button>
    </div>
  </div>
  <div id="stage" class="stage" hidden>
    <button id="stage-cancel" class="stage-cancel" type="button" title="Esc" data-i18n-aria-label="timer.cancel" hidden>×</button>
    <div id="big" class="big" role="timer">15</div>
    <p id="stage-hint" class="stage-hint"></p>
    <p id="stage-round" class="stage-hint"></p>
    <p id="stage-call" class="sr-only" role="status"></p>
    <div id="penalties" class="row" role="group" data-i18n-aria-label="penalty.label" hidden>
      <button data-pen="0" title="Ctrl+1" data-i18n="penalty.ok"></button>
      <button data-pen="2000" title="Ctrl+2">+2</button>
      <button data-pen="DNF" title="Ctrl+3">DNF</button>
      <button id="delete-last" title="Ctrl+Z" data-i18n="results.delete"></button>
      <button id="duel-share" data-i18n="duel.share" data-i18n-title="duel.shareLabel"></button>
      <button id="stage-challenges" class="primary" hidden data-i18n="challenge.toChallenges"></button>
    </div>
    <p id="duel-status" class="stage-hint" role="status"></p>
  </div>
  <dialog id="solve-opts" class="sheet" aria-labelledby="solve-opts-title">
    <form method="dialog" class="sheet-head">
      <h2 id="solve-opts-title" data-i18n="solve.options"></h2>
      <button class="close" data-i18n-aria-label="dialog.close" data-i18n-title="dialog.close">×</button>
    </form>
    <div class="row timer-opts">
      <label><input type="checkbox" id="calls-visual" /> <span data-i18n="timer.callsVisual"></span></label>
      <label><input type="checkbox" id="calls-voice" /> <span data-i18n="timer.callsVoice"></span></label>
    </div>
    <section class="cube-block clock-opts" aria-labelledby="clock-opts-title">
      <h3 id="clock-opts-title" data-i18n="opts.clock"></h3>
      <label><span data-i18n="opts.hold"></span> <select id="opt-hold"></select></label>
      <label><span data-i18n="opts.precision"></span> <select id="opt-precision"></select></label>
      <label><span data-i18n="opts.phases"></span> <select id="opt-phases"></select></label>
      <label><span data-i18n="opts.entry"></span> <select id="opt-entry"></select></label>
      <p class="hint" data-i18n="opts.phasesHint"></p>
      <details class="keys-help">
        <summary data-i18n="opts.keys"></summary>
        <dl>
          <dt data-i18n="opts.spaceKey"></dt><dd data-i18n="opts.keySpace"></dd>
          <dt>Esc</dt><dd data-i18n="opts.keyEsc"></dd>
          <dt>N</dt><dd data-i18n="solve.newScramble"></dd>
          <dt>Ctrl+1 · Ctrl+2 · Ctrl+3</dt><dd data-i18n="opts.keyPenalty"></dd>
          <dt>Ctrl+Z</dt><dd data-i18n="opts.keyDelete"></dd>
        </dl>
        <p class="hint" data-i18n="opts.keysHint"></p>
      </details>
    </section>
    <section class="cube-block round" aria-labelledby="round-opts-title">
      <h3 id="round-opts-title" data-i18n="round.title"></h3>
      <div class="row timer-opts">
        <label><span data-i18n="round.cutoff"></span> <input id="round-cutoff" placeholder="opcional" type="number" min="0" step="any" inputmode="decimal" /></label>
        <label><span data-i18n="round.limit"></span> <input id="round-limit" placeholder="opcional" type="number" min="0" step="any" inputmode="decimal" /></label>
      </div>
      <p id="round-hint" class="hint"></p>
      <ul id="round-list" class="round-list"></ul>
    </section>
    <section class="cube-block">
      <h3 data-i18n="import.title"></h3>
      <p class="hint" data-i18n="import.hint"></p>
      <div class="row"><button id="import-choose" type="button" data-i18n="import.choose"></button></div>
      <input id="import-file" type="file" accept=".txt,.json,.csv,text/plain,application/json,text/csv" hidden />
      <p id="import-status" role="status"></p>
    </section>
  </dialog>
  <dialog id="round-dialog" class="sheet" aria-labelledby="round-title">
    <form method="dialog" class="sheet-head">
      <h2 id="round-title"></h2>
      <button class="close" data-i18n-aria-label="dialog.close" data-i18n-title="dialog.close">×</button>
    </form>
    <div id="round-body" class="stats-body"></div>
  </dialog>
  <dialog id="daily-dialog" class="sheet" aria-labelledby="daily-dialog-title">
    <form method="dialog" class="sheet-head">
      <h2 id="daily-dialog-title" data-i18n="daily.title"></h2>
      <button class="close" data-i18n-aria-label="dialog.close" data-i18n-title="dialog.close">×</button>
    </form>
    <div id="daily-body" class="stats-body"></div>
  </dialog>
  <dialog id="support-dialog" class="sheet" aria-labelledby="support-title">
    <form method="dialog" class="sheet-head">
      <h2 id="support-title" data-i18n="support.title"></h2>
      <button class="close" data-i18n-aria-label="dialog.close" data-i18n-title="dialog.close">×</button>
    </form>
    <div class="stats-body">
      <p data-i18n="support.text"></p>
      <!-- one link per way to give; Ko-fi goes here too -->
      <div class="row"><a class="button primary" href="https://github.com/sponsors/sancospi" target="_blank" rel="noopener" data-i18n="support.github"></a></div>
      <p class="hint" data-i18n="support.githubHint"></p>
    </div>
  </dialog>
  <dialog id="cube-dialog" class="sheet" aria-labelledby="cube-dialog-title">
    <form method="dialog" class="sheet-head">
      <h2 id="cube-dialog-title" data-i18n="cube.connection"></h2>
      <button class="close" data-i18n-aria-label="dialog.close" data-i18n-title="dialog.close">×</button>
    </form>
  </dialog>
  <dialog id="net-dialog" class="sheet" aria-labelledby="net-dialog-title">
    <form method="dialog" class="sheet-head">
      <h2 id="net-dialog-title" data-i18n="solve.scramble"></h2>
      <button class="close" data-i18n-aria-label="dialog.close" data-i18n-title="dialog.close">×</button>
    </form>
    <div id="net-big" class="net-big" aria-hidden="true"></div>
    <div id="net-scramble" class="scramble"></div>
  </dialog>
  <dialog id="solve-detail" class="sheet" aria-labelledby="solve-detail-title">
    <form method="dialog" class="sheet-head">
      <h2 id="solve-detail-title" class="detail-time"></h2>
      <button class="close" data-i18n-aria-label="dialog.close" data-i18n-title="dialog.close">×</button>
    </form>
    <div id="solve-detail-body" class="stats-body"></div>
  </dialog>
  <dialog id="stats-dialog" class="sheet" aria-labelledby="stats-title">
    <form method="dialog" class="sheet-head">
      <h2 id="stats-title" data-i18n="stats.title"></h2>
      <button class="close" data-i18n-aria-label="dialog.close" data-i18n-title="dialog.close">×</button>
    </form>
    <div id="stats-body" class="stats-body"></div>
  </dialog>
  <dialog id="practice" class="sheet" aria-labelledby="practice-title">
    <form method="dialog" class="sheet-head">
      <h2 id="practice-title"></h2>
      <button id="practice-help-toggle" type="button" class="help-toggle" aria-expanded="false" aria-controls="practice-help" data-i18n-aria-label="practice.helpLabel" data-i18n-title="practice.helpLabel">?</button>
      <button class="close" data-i18n-aria-label="dialog.close" data-i18n-title="dialog.close">×</button>
    </form>
    <div id="practice-help" class="practice-help" hidden></div>
    <div class="practice-view">
      <div class="row practice-bar">
        <span id="practice-mode" class="hint"></span>
        <button id="practice-reveal" type="button" class="small"></button>
      </div>
      <div id="practice-tiles" class="practice-tiles"></div>
      <div id="practice-card" class="practice-card" tabindex="-1">
        <ol id="practice-steps" class="steps" data-i18n-aria-label="practice.steps">
          <li id="practice-step-scramble" data-i18n="practice.stepScramble"></li>
          <li id="practice-step-solve" data-i18n="practice.stepSolve"></li>
        </ol>
        <p id="practice-card-top" class="card-top"></p>
        <div id="practice-card-diagram" class="card-diagram"></div>
        <div id="practice-card-scramble" class="card-scramble"><code id="practice-setup" class="card-moves"></code><p id="practice-setup-note"></p></div>
        <div id="practice-rotate" class="rotate"></div>
        <div id="practice-next" class="next" aria-live="polite"></div>
        <button id="practice-clock" type="button" class="practice-clock" aria-describedby="practice-card-hint">0.00</button>
        <p id="practice-delta" class="delta"></p>
        <p id="practice-notice" class="hint"></p>
        <div id="practice-desc" aria-live="polite"></div>
        <div id="practice-list" class="tokens"></div>
        <div id="practice-solution" class="card-solution"><span id="practice-alg-label" class="hint"></span><div id="practice-alg"></div></div>
        <p id="practice-card-hint" class="hint"></p>
        <div id="practice-grade" class="row grade">
          <button id="practice-clean" type="button" class="primary" aria-keyshortcuts="Space"></button>
          <button id="practice-fail" type="button" aria-keyshortcuts="x"><span data-i18n="practice.failBtn"></span><kbd class="key-hint" aria-hidden="true">X</kbd></button>
        </div>
        <div class="row"><button id="practice-again" type="button" class="primary" hidden></button></div>
      </div>
      <div class="row practice-actions">
        <button id="practice-peek" type="button" data-i18n="practice.peek"></button>
        <button id="practice-lap-fail" type="button" aria-keyshortcuts="x"><span data-i18n="practice.failBtn"></span><kbd class="key-hint" aria-hidden="true">X</kbd></button>
        <button id="practice-finish" type="button" data-i18n="practice.finish"></button>
      </div>
      <div id="practice-session" class="practice-session"></div>
      <div id="practice-fingers"></div>
      <div id="practice-anim" class="row"></div>
      <div id="practice-player" class="anim-player" role="group" data-i18n-aria-label="anim.label" hidden></div>
      <details id="practice-change" class="practice-change">
        <summary id="practice-change-label"></summary>
        <fieldset id="practice-algs" class="algs"></fieldset>
      </details>
    </div>
    <p id="practice-status" class="sr-only" role="status"></p>
  </dialog>
  <dialog id="quiz" class="sheet" aria-labelledby="quiz-title">
    <form method="dialog" class="sheet-head">
      <h2 id="quiz-title"></h2>
      <button id="quiz-help-toggle" type="button" class="help-toggle" aria-expanded="false" aria-controls="quiz-help" data-i18n-aria-label="practice.helpLabel" data-i18n-title="practice.helpLabel">?</button>
      <button class="close" data-i18n-aria-label="dialog.close" data-i18n-title="dialog.close">×</button>
    </form>
    <p id="quiz-help" class="practice-help" hidden></p>
    <!-- the explanation's animation: outside #quiz-body, which is rebuilt on every render, so it's never re-attached; above it, so it's seen -->
    <div id="quiz-player" class="anim-player" role="group" data-i18n-aria-label="anim.label" hidden></div>
    <div id="quiz-body"></div>
    <p id="quiz-status" class="sr-only" role="status"></p>
  </dialog>
  <dialog id="cross" class="sheet" aria-labelledby="cross-title">
    <form method="dialog" class="sheet-head">
      <h2 id="cross-title"></h2>
      <button class="close" data-i18n-aria-label="dialog.close" data-i18n-title="dialog.close">×</button>
    </form>
    <div id="cross-player" hidden></div>
    <div id="cross-body"></div>
    <p id="cross-status" class="sr-only" role="status"></p>
  </dialog>
  <dialog id="cross-viewer" class="sheet" aria-labelledby="cross-viewer-title">
    <form method="dialog" class="sheet-head">
      <h2 id="cross-viewer-title"></h2>
      <button class="close" data-i18n-aria-label="dialog.close" data-i18n-title="dialog.close">×</button>
    </form>
    <div id="cross-viewer-player"></div>
    <p id="cross-viewer-alg"></p>
  </dialog>
  <script type="module" src="/src/boot.ts"></script>
</body>
</html>
